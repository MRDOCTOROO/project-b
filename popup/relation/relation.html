<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识图谱</title>
    <link rel="stylesheet" href="relation.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>知识图谱</h1>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="搜索节点...">
                <button id="searchButton" class="btn primary">搜索</button>
                <button id="backButton" class="btn secondary">返回</button>
            </div>
        </div>
        <div id="mynetwork">
            <div id="loadingOverlay">
                <div class="spinner"></div>
                <span>正在加载图谱...</span>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="../../lib/vis-network.min.js"></script>
    <script type="text/javascript" src="relation.js"></script>
</body>
</html>
