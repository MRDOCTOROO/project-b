<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能资源助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css">
    <link rel="stylesheet" href="popup.css">
   
    <script src="../lib/marked.min.js"></script>
    <script src="../lib/highlight.min.js"></script>
    <script src="../lib/purify.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- 左侧：历史对话 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>历史对话</h3>

                <!-- 在 HTML 中添加模式切换按钮 -->
                <!-- 模式切换按钮和状态提示 -->
                <div class="mode-switch">
                    <!-- 当前模式: 任务助手模式 -->
                    <button id="modeToggle" >点击切换模式</button> 
                    <div id="currentModeDisplay" >任务助手模式</div>
                    <!-- <button id="resourceBtn" class="mode-btn resource">任务助手模式</button>
                    <button id="documentBtn" class="mode-btn document">知识库助手模式</button>
                    <button id="imageBtn" class="mode-btn image">图片识别模式</button> -->

                     <!-- <p id="currentModeDisplay">当前模式: 任务助手模式</p> -->

                </div>
                <!-- <button id="changemodel" class="btn new-chat" title="点击切换资源建议模式或文档解析查询模式">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    切换对话模式
                </button> -->

                <button id="newChatBtn" class="btn new-chat" title="点击新建对话">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    新建对话
                </button>
            </div>
            <div class="search-box">
                <input type="text" placeholder="搜索历史对话..." id="searchInput">
                <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 0 0 1.48-5.34c-.47-2.78-2.79-5-5.59-5.34a6.505 6.505 0 0 0-7.27 7.27c.34 2.8 2.56 5.12 5.34 5.59a6.5 6.5 0 0 0 5.34-1.48l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0 .41-.41.41-1.08 0-1.49L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </div>
            <ul id="chatList" class="chat-list"></ul>
        </aside>

        <!-- 创建和切换对话 -->
         
        <!-- 右侧：对话区域 -->
        <main class="chat-container">
            <div id="chatContent" class="chat-history markdown-body"></div>
            
            <div class="chat-input-container">
                <textarea id="userInput" placeholder="请输入您的任务描述...（Shift+Enter换行）"></textarea>
                <div class="button-group">
                    <button id="clearBtn" class="btn danger">清除对话</button>
                    <button id="sendBtn" class="btn primary">发送</button>
                    <button id="logoutBtn" class="btn exit">退出登录</button>
                    <button id="openUpload" class="btn file">上传附件</button>
                    <input type="file" id="fileInput" title="上传附件" style="display: none;"  accept=".doc, .docx, .pdf, .txt">
                    <button id="imageUploadBtn" class="btn image">上传图片</button>
                    <input type="file" id="imageFileInput" title="上传图片" style="display: none;" accept="image/*">
                    
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="popup.js"></script>
</body>
</html>
