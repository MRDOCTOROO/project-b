<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>更多功能</title>
  <script src="https://cdn.jsdelivr.net/npm/neo4j-driver"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    svg {
      width: 100%;
      height: 100vh;
      background: #f0f0f0;
    }
    .node circle {
      stroke: #fff;
      stroke-width: 1.5px;
    }
    .node text {
      pointer-events: none;
      font: 12px sans-serif;
    }
    .link {
      stroke: #999;
      stroke-opacity: 0.6;
    }
  </style>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <svg></svg>
  <div class="container">
    <h2>更多功能页面</h2>
    <p>你可以在这里添加插件设置、功能扩展等内容。</p>
    <button id="backBtn">返回主界面</button>
  </div>

  <script type="module" src="recomond.js">  </script>
</body>
</html>
