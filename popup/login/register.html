<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <h2>创建账户</h2>
        <div class="input-group">
            <label for="username">用户名</label>
            <input type="text" id="username" placeholder="设置您的用户名">
        </div>
        <div class="input-group">
            <label for="relname">真实姓名</label>
            <input type="text" id="relname" placeholder="请输入您的姓名">
        </div>
        <div class="input-group">
            <label for="password">密码</label>
            <input type="password" id="password" placeholder="设置您的密码">
        </div>
        <div class="input-group">
            <label for="confirm-password">确认密码</label>
            <input type="password" id="confirm-password" placeholder="请再次输入密码">
        </div>
        <button id="registerBtn" class="btn-primary">注册</button>
        <p class="switch-link">
            已有账号？ <a href="login.html">点击登录</a>
        </p>
    </div>
    <script src="register.js"></script>
</body>
</html>
